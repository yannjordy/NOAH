name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create clean Flutter project
        run: flutter create --org com.noah --project-name noah_app --platforms android temp_project

      - name: Copy lib and pubspec
        run: |
          rm -rf temp_project/lib
          cp -r lib temp_project/lib
          cp pubspec.yaml temp_project/pubspec.yaml

      - name: Pin Kotlin 1.9.22
        run: |
          cd temp_project
          grep -n "kotlin" android/settings.gradle || true
          cat android/settings.gradle
          sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "1.9.22"/g' android/settings.gradle
          sed -i "s/kotlin_version = \".*\"/kotlin_version = '1.9.22'/" android/build.gradle 2>/dev/null || true
          echo "--- After fix ---"
          grep -n "kotlin" android/settings.gradle || true

      - name: Flutter pub get
        run: cd temp_project && flutter pub get

      - name: Build APK
        run: cd temp_project && flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: noah-apk
          path: temp_project/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
