name: ai_trading_assistant
description: AI-powered crypto trading assistant — fintech grade
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & WebSocket
  dio: ^5.4.3
  web_socket_channel: ^3.0.0

  # Charts
  fl_chart: ^0.68.0

  # Storage
  path_provider: ^2.1.0
  supabase_flutter: ^2.6.0

  # Links
  url_launcher: ^6.2.0

  # UI & animations
  shimmer: ^3.0.0

  # Utils
  intl: ^0.20.0
  uuid: ^4.4.0
  crypto: ^3.0.3
  encrypt: ^5.0.3
  flutter_local_notifications: ^22.0.0
  home_widget: ^0.9.3
  flutter_foreground_task: ^8.13.2
  image_picker: ^1.0.4
  speech_to_text: ^7.4.0
  local_auth: ^2.2.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo-remove.png"
  adaptive_icon_background: "#0a0a0f"
  adaptive_icon_foreground: "assets/logo-remove.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
